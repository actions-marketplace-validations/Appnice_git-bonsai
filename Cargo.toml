[package]
name = "git-bonsai"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Pixel bonsai grown from a GitHub account's public activity, one day at a time"
license = "MIT"
repository = "https://github.com/appnice/git-bonsai"
readme = "README.md"
keywords = ["github", "profile-readme", "pixel-art", "bonsai", "generative-art"]
categories = ["command-line-utilities", "visualization"]
publish = false

[features]
default = ["network", "cli", "gif"]
# GitHub GraphQL client (blocking reqwest + rustls). Off = pure library (e.g. WASM).
network = ["dep:reqwest"]
# The `git-bonsai` binary.
cli = ["network", "dep:clap", "dep:anyhow", "dep:toml", "dep:jiff"]
# Animated GIF export (`--gif`).
gif = ["dep:gif"]

[[bin]]
name = "git-bonsai"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
gif = { version = "0.13", optional = true }
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "macros", "parsing", "formatting"] }
sha2 = "0.10"
rand_core = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
toml = { version = "0.9", optional = true }
jiff = { version = "0.2", optional = true }

[dev-dependencies]
gif = "0.13"
insta = "1"
proptest = "1"
roxmltree = "0.20"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3


[profile.release]
strip = true
lto = true
codegen-units = 1
